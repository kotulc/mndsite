title: mdsite
description: Static documentation sites from plain markdown
repo_url: https://github.com/kotulc/mdsite
feed_url: updates
theme_toggle: navbar
toc: true

theme:
  color: default
  typeset: sans

# Local keyword + embedding metadata (always on during ingest)
meta:
  max_keywords: 32
  page_tags: 5
  section_tags: 8
  related_links: 3
  min_relevance: 0.1

content: ./docs
output: ./dist

flatten:
  - updates

nav_order:
  "": [about, getting-started, configuration]
  features: [overview, components]
  specifications: [format]
  updates: [welcome]
