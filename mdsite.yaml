title: mdsite
description: Static documentation sites from plain markdown
repo_url: https://github.com/kotulc/mdsite
feed_url: updates
theme_toggle: navbar
toc: true

theme:
  color: default
  typeset: sans

# NLP extraction (runs only with --extract or on_build: true; CI gates on the ENRICH var)
extract:
  url: http://127.0.0.1:8000
  on_build: true
  max_comparisons: 128
  top_n_related: 3
  extract_descriptions: true

content: ./docs
output: ./dist

flatten:
  - updates

nav_order:
  "": [about, getting-started, configuration]
  features: [overview, components]
  specifications: [format]
  updates: [welcome]
