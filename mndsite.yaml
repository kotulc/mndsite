# mndsite's own site config, and the worked example for the 0.2 contract: every key is
# set to a real value rather than left blank. Optional keys name their default instead —
# `none` (feature off), `auto` (derive it), `default` (built-in) — so nothing here is "".

title: mndsite
description: Static documentation sites from plain markdown
repo_url: https://github.com/kotulc/mndsite
feed_url: updates
footer: MIT licensed · built with mndsite

content: ./docs
output: ./dist

# Consumer extension points, mirrored into components/custom/ and public/assets/ each build.
components: ./site/components
assets: ./site/assets

nav_order:
  "": [about, getting-started, configuration]
  features: [overview, components]
  specifications: [format]
  updates: [welcome]

theme:
  color: default       # default, slate, gray, blue, indigo, violet, rose, orange, ...
  typeset: sans        # sans, serif, humanist, geometric, mono
  navbar: primary      # none, primary (theme tint), or any CSS color
  footer: primary

# Frontmatter keys mndsite reads. Frontmatter is inert unless named here or in facets.
# `none` disables a mapping: with `title: none` no key names the title and pages fall
# back to their slug, so nav labels and <title> still agree.
fields:
  title: title
  description: [description, desc]
  date: date
  reading_time: reading_time
  related: related
  identity: doc_id

# Content dimensions rendered as chips and filters. `field` is required; the rest default
# to: label from the facet name, color from the palette in declaration order, ui chips,
# sort alpha, and all values allowed.
facets:
  categories:
    field: categories
    label: Category
    color: blue          # blue, violet, amber, rose, green, teal, or a hue 0-359
    ui: chips            # chips, select, badge, none
    sort: alpha          # alpha, semver, date, listed
  tags:
    field: tags
    label: Tag
    color: violet
    ui: chips
    sort: alpha
  version:
    field: version
    label: Contract
    color: teal
    ui: select
    sort: semver
  status:
    field: status
    label: Status
    color: amber
    ui: badge
    sort: listed
    values: [draft, stable, deprecated]

# Named facet presets: a map of facet name to allowed value(s). `default` names the active
# preset, or "all" for no preset. A facet a preset leaves out is unconstrained, so `current`
# spans every contract version and `latest` spans every status.
collections:
  default: current
  current: { status: [stable] }              # what the shipped contract documents
  preview: { status: [stable, draft] }       # plus what is planned
  latest:  { version: latest }               # the newest contract, whatever its status
  archive: { status: [deprecated] }          # superseded docs, kept for history

# Left tree views: "tree" is the directory hierarchy, any other entry names a facet.
sidebar:
  views: [tree, version, status]

# Rendered elements, in display order. Omit an element to turn it off; `header` also
# accepts any facet name, which places that facet's chips there whatever its ui.
display:
  crumbs: [home, path]
  header: [date, reading_time, version, status, facets]
  toc: [description, sections, related, edit]
  contents: [description, sections, related]
  navbar: [theme, feed, github]

# "Edit this page" targets. Used only when repo_url is set.
edit:
  branch: main
  path: docs            # auto derives this from the content dir
  url: auto             # auto derives a template from the repo_url host
