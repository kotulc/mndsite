# mndsite's own site config, and the worked example for the 0.3 contract: every key is
# set to a real value rather than left blank. Optional keys name their default instead —
# `none` (feature off), `auto` (derive it), `default` (built-in) — so nothing here is "".
# On/off flags are booleans; comments list allowed values only when more than one exists.

title: mndsite
description: Static documentation sites from plain markdown
repo_url: https://github.com/kotulc/mndsite
feed_url: updates
footer: MIT licensed · built with mndsite

content: ./docs
output: ./dist

# Consumer extension points, mirrored into components/custom/ and public/assets/ each build.
components: ./site/components
assets: ./site/assets

nav_order:
  "": [about, getting-started, configuration]
  features: [overview, components]
  specifications: [format]
  updates: [welcome]

theme:
  color: default       # default, slate, gray, blue, indigo, violet, rose, orange, ...
  typeset: sans        # sans, serif, humanist, geometric, mono
  navbar: primary      # none, primary (theme tint), or any CSS color
  footer: primary

# Frontmatter keys mndsite reads. `facets` declare content dimensions; `groups` bundle
# facet names for the sidebar (chip order within each group follows the facet list).
frontmatter:
  title: title
  description: [description, desc]
  date: date
  reading_time: reading_time
  related: related
  facets:
    categories:
      key: categories
      label: Category
      color: blue
      sort: alpha
    tags:
      key: tags
      label: Tags
      color: violet
      sort: alpha
    status:
      key: status
      label: Status
      color: amber
      sort: alpha
  groups:
    Tags: [status, categories, tags]
    Versions: versioning

# Optional edition tracking — wire into the sidebar via a group value of `versioning`.
versioning:
  field: version
  label: Versions
  color: teal
  inherit: true
  history: true
  default: latest
  group_by: status

# Rendered elements, in display order. `sidebar` lists browse groups; `header` also accepts
# facet names and frontmatter field keys.
display:
  crumbs: [home, path]
  sidebar: [pages, Tags, Versions]
  header: [date, reading_time, version, status, facets]
  toc: [description, sections, related, edit]
  contents: [description, sections, related]
  navbar: [theme, feed, github]

# "Edit this page" targets. Used only when repo_url is set.
edit:
  branch: main
  path: docs            # auto derives this from the content dir
  url: auto             # auto derives a template from the repo_url host
